api:
  openai_base_url: http://localhost:8080/v1
  openai_model: local-model
settings:
  enable_thinking: false
  # Max number of enforced review rounds after the final report is written.
  # Each round: Reviewer checks the report, Orchestrator fixes violations by
  # editing the report text. Capped to guarantee termination. 2 is recommended.
  max_review_rounds: 2
  concurrency:
    max_concurrent_tasks: 3
  quotas:
    # IMPORTANT: Quotas are GLOBAL (shared across ALL agents in the system).
    # Each key MUST be unique — duplicate YAML keys silently overwrite earlier ones!
    # The engine auto-injects these as prompt format variables: {key_quota}
    # e.g. "web_search: 10" becomes {web_search_quota} = 10 in your prompts.
    # Both flat integers and dict-with-limit are supported.
    delegate_tasks: 20
    # web_search and fetch_url_to_workspace are aliased to this shared counter
    web_calls:
      limit: 100
      rules:
        reserve: 10
    write_workspace_file: 20
    write_todos: 30
    read_todos: 30
    think_tool: 30
    read_workspace_file:
      limit: 60
      rules:
        max_lines: 400
    grep_workspace_file:
      limit: 60
      rules:
        max_matches: 15
    list_workspace_files: 20
  fast_test:
    enabled: false
    overrides:
      concurrency:
        max_concurrent_tasks: 1
      quotas:
        web_calls:
          limit: 30
        delegate_tasks: 12
        read_workspace_file:
          limit: 15
        grep_workspace_file:
          limit: 15
        write_workspace_file: 5
  allocation:
    flatness_constant: 7
    floor: 6
  enable_conversational_memory: true
  enable_session_persistence: true
  workspace:
    type: disk
    dir: "~/.{APP_NAME}/workspace"
    session_isolation: true  # Auto-creates timestamped run folders (e.g. run_1748192400/)
    required_artifact: "final_report.md"
